
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandoffHub - Handovers</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #080b14;
            color: white;
            font-family: Arial, sans-serif;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #0d111d;
            border-right: 1px solid #20283a;
            padding: 28px 18px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00e5ff;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 12px;
            color: #6f7a90;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .nav-title {
            color: #59657a;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 12px 10px;
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 6px;
            border-radius: 10px;
            color: #9ca7bb;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #101d2d;
            color: #00e5ff;
            box-shadow: inset 2px 0 0 #00e5ff;
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 35px 40px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .welcome h1 {
            margin: 0;
            font-size: 30px;
        }

        .welcome p {
            margin-top: 8px;
            color: #7f8ba0;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .create-btn {
            display: inline-block;
            padding: 11px 17px;
            border-radius: 9px;
            background: #00e5ff;
            color: #080b14;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
            white-space: nowrap;
        }

        .create-btn:hover {
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.35);
        }

        .profile {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #00e5ff, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .handover-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .handover-card {
            background: linear-gradient(145deg, #101624, #0d121e);
            border: 1px solid #202b3e;
            border-radius: 16px;
            padding: 24px;
            transition: 0.2s;
            overflow-wrap: anywhere;
        }

        .handover-card:hover {
            border-color: #00e5ff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.08);
        }

        .handover-title {
            font-size: 21px;
            color: white;
            margin-bottom: 10px;
        }

        .handover-description {
            color: #7f8ba0;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .details {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .detail-label {
            color: #59657a;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail-value {
            color: white;
            font-weight: bold;
        }

        .status { color: #22c55e; }
        .readiness { color: #00e5ff; }

        .view-btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        .view-btn:hover {
            background: #00e5ff;
            color: #080b14;
        }

        .loading {
            color: #7f8ba0;
            padding: 30px;
            grid-column: 1 / -1;
        }

        @media (max-width: 1000px) {
            .sidebar { width: 220px; }
            .main { padding: 30px 24px; }
            .handover-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 700px) {
            .layout { display: block; }
            .sidebar { width: 100%; }
            .main { padding: 25px 18px; }
            .topbar { align-items: flex-start; }
            .top-actions { flex-wrap: wrap; justify-content: flex-end; }
            .welcome h1 { font-size: 25px; }
        }
    </style>
</head>

<body>
<div class="layout">

    <!-- CONSISTENT SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">HandoffHub</div>
        <div class="tagline">Knowledge shouldn't leave with people.</div>

        <div class="nav-title">Workspace</div>

        <a href="/dashboard.html" class="nav-item">Dashboard</a>
        <a href="/projects.html" class="nav-item">Projects</a>
        <a href="/handovers.html" class="nav-item active">Handovers</a>
        <a href="/tasks.html" class="nav-item">Tasks</a>
        <a href="/issues.html" class="nav-item">Issues</a>
        <a href="/knowledge.html" class="nav-item">Knowledge</a>
        <a href="/risk.html" class="nav-item">Risk</a>

        <div class="nav-title">System</div>

        <a href="/activity.html" class="nav-item">Activity</a>
        <a href="/profile.html" class="nav-item">Profile</a>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="topbar">
            <div class="welcome">
                <h1>Handovers</h1>
                <p>Manage and track responsibility transfers.</p>
            </div>

            <div class="top-actions">
                <a href="/create-handover.html" class="create-btn">
                    + Create Handover
                </a>
                <div class="profile">AU</div>
            </div>
        </div>

        <div class="handover-grid" id="handoverContainer">
            <div class="loading">Loading handovers...</div>
        </div>
    </main>

</div>

<script>
    fetch("/api/handovers")
        .then(function(response) {
            if (!response.ok) {
                throw new Error("Failed to load handovers");
            }
            return response.json();
        })
        .then(function(handovers) {
            const container = document.getElementById("handoverContainer");
            container.innerHTML = "";

            if (!Array.isArray(handovers) || handovers.length === 0) {
                container.innerHTML =
                    '<div class="loading">No handovers found.</div>';
                return;
            }

            handovers.forEach(function(handover) {
                const card = document.createElement("div");
                card.className = "handover-card";

                const title = document.createElement("div");
                title.className = "handover-title";
                title.textContent =
                    handover.title || handover.name || "Handover #" + handover.id;

                const description = document.createElement("div");
                description.className = "handover-description";
                description.textContent =
                    handover.description || "No description available.";

                const details = document.createElement("div");
                details.className = "details";

                const statusBlock = document.createElement("div");
                const statusLabel = document.createElement("div");
                statusLabel.className = "detail-label";
                statusLabel.textContent = "Status";

                const statusValue = document.createElement("div");
                statusValue.className = "detail-value status";
                statusValue.textContent = handover.status || "UNKNOWN";

                statusBlock.appendChild(statusLabel);
                statusBlock.appendChild(statusValue);

                const readinessBlock = document.createElement("div");
                const readinessLabel = document.createElement("div");
                readinessLabel.className = "detail-label";
                readinessLabel.textContent = "Readiness";

                const readinessValue = document.createElement("div");
                readinessValue.className = "detail-value readiness";
                readinessValue.textContent =
                    (handover.readinessScore ?? 0) + "/100";

                readinessBlock.appendChild(readinessLabel);
                readinessBlock.appendChild(readinessValue);

                const idBlock = document.createElement("div");
                const idLabel = document.createElement("div");
                idLabel.className = "detail-label";
                idLabel.textContent = "Handover ID";

                const idValue = document.createElement("div");
                idValue.className = "detail-value";
                idValue.textContent = "#" + handover.id;

                idBlock.appendChild(idLabel);
                idBlock.appendChild(idValue);

                details.appendChild(statusBlock);
                details.appendChild(readinessBlock);
                details.appendChild(idBlock);

                const viewButton = document.createElement("a");
                viewButton.className = "view-btn";
                viewButton.href =
                    "/handover-details.html?id=" +
                    encodeURIComponent(handover.id);
                viewButton.textContent = "View Details";

                card.appendChild(title);
                card.appendChild(description);
                card.appendChild(details);
                card.appendChild(viewButton);

                container.appendChild(card);
            });
        })
        .catch(function(error) {
            console.error("Handover API error:", error);
            document.getElementById("handoverContainer").innerHTML =
                '<div class="loading">Unable to load handovers. Please refresh the page.</div>';
        });
</script>
</body>
</html>
