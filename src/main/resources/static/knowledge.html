
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandoffHub - Knowledge</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #080b14;
            color: white;
            font-family: Arial, sans-serif;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #0d111d;
            border-right: 1px solid #20283a;
            padding: 28px 18px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00e5ff;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 12px;
            color: #6f7a90;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .nav-title {
            color: #59657a;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 12px 10px;
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 6px;
            border-radius: 10px;
            color: #9ca7bb;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #101d2d;
            color: #00e5ff;
            box-shadow: inset 2px 0 0 #00e5ff;
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 35px 40px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .welcome h1 {
            margin: 0;
            font-size: 30px;
        }

        .welcome p {
            margin-top: 8px;
            color: #7f8ba0;
        }

        .profile {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #00e5ff, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .knowledge-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .knowledge-card {
            background: linear-gradient(145deg, #101624, #0d121e);
            border: 1px solid #202b3e;
            border-radius: 16px;
            padding: 24px;
            transition: 0.2s;
            overflow-wrap: anywhere;
        }

        .knowledge-card:hover {
            border-color: #00e5ff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.08);
        }

        .knowledge-icon {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background: #102637;
            color: #00e5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 18px;
        }

        .knowledge-title {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .knowledge-content {
            color: #7f8ba0;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .category {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(139, 92, 246, 0.12);
            color: #a78bfa;
            font-size: 12px;
        }

        .handover-label {
            margin-top: 18px;
            color: #59657a;
            font-size: 12px;
        }

        .loading {
            color: #7f8ba0;
            padding: 30px;
            grid-column: 1 / -1;
        }

        @media (max-width: 1000px) {
            .sidebar { width: 220px; }
            .main { padding: 30px 24px; }
            .knowledge-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 700px) {
            .layout { display: block; }
            .sidebar { width: 100%; }
            .main { padding: 25px 18px; }
            .welcome h1 { font-size: 25px; }
        }
    </style>
</head>

<body>
<div class="layout">

    <!-- CONSISTENT SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">HandoffHub</div>
        <div class="tagline">Knowledge shouldn't leave with people.</div>

        <div class="nav-title">Workspace</div>

        <a href="/dashboard.html" class="nav-item">Dashboard</a>
        <a href="/projects.html" class="nav-item">Projects</a>
        <a href="/handovers.html" class="nav-item">Handovers</a>
        <a href="/tasks.html" class="nav-item">Tasks</a>
        <a href="/issues.html" class="nav-item">Issues</a>
        <a href="/knowledge.html" class="nav-item active">Knowledge</a>
        <a href="/risk.html" class="nav-item">Risk</a>

        <div class="nav-title">System</div>

        <a href="/activity.html" class="nav-item">Activity</a>
        <a href="/profile.html" class="nav-item">Profile</a>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="topbar">
            <div class="welcome">
                <h1>Knowledge</h1>
                <p>Centralized technical and project knowledge.</p>
            </div>

            <div class="profile">AU</div>
        </div>

        <div class="knowledge-grid" id="knowledgeContainer">
            <div class="loading">Loading knowledge...</div>
        </div>
    </main>

</div>

<script>
    fetch("/api/knowledge")
        .then(function(response) {
            if (!response.ok) {
                throw new Error("Failed to load knowledge");
            }

            return response.json();
        })
        .then(function(knowledgeList) {
            const container =
                document.getElementById("knowledgeContainer");

            container.innerHTML = "";

            if (!Array.isArray(knowledgeList) ||
                knowledgeList.length === 0) {
                container.innerHTML =
                    '<div class="loading">No knowledge records found.</div>';
                return;
            }

            knowledgeList.forEach(function(knowledge) {
                const card = document.createElement("div");
                card.className = "knowledge-card";

                const icon = document.createElement("div");
                icon.className = "knowledge-icon";
                icon.textContent = "◈";

                const title = document.createElement("div");
                title.className = "knowledge-title";
                title.textContent =
                    knowledge.title || "Untitled Knowledge";

                const content = document.createElement("div");
                content.className = "knowledge-content";
                content.textContent =
                    knowledge.content ||
                    "No knowledge content available.";

                const category = document.createElement("span");
                category.className = "category";
                category.textContent =
                    knowledge.category || "GENERAL";

                const handoverLabel = document.createElement("div");
                handoverLabel.className = "handover-label";
                handoverLabel.textContent =
                    "Handover #" +
                    (knowledge.handover && knowledge.handover.id
                        ? knowledge.handover.id
                        : "N/A");

                card.appendChild(icon);
                card.appendChild(title);
                card.appendChild(content);
                card.appendChild(category);
                card.appendChild(handoverLabel);

                container.appendChild(card);
            });
        })
        .catch(function(error) {
            console.error("Knowledge API error:", error);

            document.getElementById("knowledgeContainer").innerHTML =
                '<div class="loading">Unable to load knowledge. Please refresh the page.</div>';
        });
</script>

</body>
</html>
