
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HandoffHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #080b14;
            color: #f1f5f9;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px;
            background: #111827;
            border: 1px solid #263449;
            border-radius: 18px;
            box-shadow: 0 0 35px rgba(0, 255, 200, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #42f5c8;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .logo p {
            color: #94a3b8;
            font-size: 14px;
        }

        h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #334155;
            border-radius: 9px;
            background: #080b14;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #42f5c8;
            box-shadow: 0 0 0 2px rgba(66, 245, 200, 0.1);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #42f5c8;
            color: #07111a;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #20dcb0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            color: #fca5a5;
        }

        #message.success {
            color: #42f5c8;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>
<div class="login-card">

    <div class="logo">
        <h1>HandoffHub</h1>
        <p>Knowledge shouldn't leave with people.</p>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to access your workspace.</p>

    <form id="loginForm">
        <label for="email">Email address</label>
        <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
        >

        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
        >

        <button type="submit" id="loginButton">Sign In</button>

        <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="footer">
        HandoffHub · Knowledge &amp; Responsibility Management
    </p>

</div>

<script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    // Show Spring Security login errors from the URL.
    const params = new URLSearchParams(window.location.search);

    if (params.has("error")) {
        message.textContent =
            "Login failed. Please check your email and password.";
    } else if (params.has("logout")) {
        message.classList.add("success");
        message.textContent = "You have been logged out successfully.";
    }

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        message.textContent = "";
        message.classList.remove("success");

        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";

        const formData = new URLSearchParams();
        formData.append(
            "email",
            document.getElementById("email").value.trim()
        );
        formData.append(
            "password",
            document.getElementById("password").value
        );

        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },
                body: formData.toString(),
                credentials: "same-origin",
                redirect: "follow"
            });

            if (response.redirected &&
                new URL(response.url).pathname === "/dashboard.html") {
                window.location.replace("/dashboard.html");
                return;
            }

            if (response.redirected &&
                new URL(response.url).pathname === "/login.html") {
                message.textContent =
                    "Login failed. Please check your email and password.";
            } else if (!response.ok) {
                message.textContent =
                    "Unable to sign in. Please try again.";
            } else {
                message.textContent =
                    "Login response received, but the session needs verification.";
            }

        } catch (error) {
            message.textContent =
                "Unable to connect to the server. Please try again.";
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Sign In";
        }
    });
</script>
</body>
</html>
