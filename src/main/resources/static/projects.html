
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandoffHub - Projects</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080b14;
            color: white;
            font-family: Arial, sans-serif;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #0d111d;
            border-right: 1px solid #20283a;
            padding: 28px 18px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00e5ff;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 12px;
            color: #6f7a90;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .nav-title {
            color: #59657a;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 12px 10px;
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 6px;
            border-radius: 10px;
            color: #9ca7bb;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #101d2d;
            color: #00e5ff;
            box-shadow: inset 2px 0 0 #00e5ff;
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 35px 40px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .welcome h1 {
            margin: 0;
            font-size: 30px;
        }

        .welcome p {
            margin-top: 8px;
            color: #7f8ba0;
        }

        .profile {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #00e5ff, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .project-header h2 {
            margin: 0;
            font-size: 19px;
        }

        .project-count {
            color: #7f8ba0;
            font-size: 13px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .project-card {
            background: linear-gradient(145deg, #101624, #0d121e);
            border: 1px solid #202b3e;
            border-radius: 16px;
            padding: 24px;
            transition: 0.2s;
            overflow-wrap: anywhere;
        }

        .project-card:hover {
            border-color: #00e5ff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.08);
            transform: translateY(-2px);
        }

        .project-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: #102331;
            color: #00e5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 18px;
        }

        .project-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .project-description {
            color: #7f8ba0;
            font-size: 13px;
            line-height: 1.6;
            min-height: 42px;
        }

        .project-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #20283a;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            font-size: 12px;
            font-weight: bold;
        }

        .project-id {
            color: #59657a;
            font-size: 12px;
        }

        .loading {
            color: #7f8ba0;
            padding: 30px;
            grid-column: 1 / -1;
        }

        @media (max-width: 1200px) {
            .projects {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .main {
                padding: 30px 25px;
            }
        }

        @media (max-width: 800px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                padding: 20px 18px;
            }

            .tagline {
                margin-bottom: 20px;
            }

            .main {
                padding: 25px 18px;
            }
        }

        @media (max-width: 520px) {
            .projects {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .topbar {
                margin-bottom: 25px;
            }
        }
    </style>
</head>

<body>
<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">HandoffHub</div>

        <div class="tagline">
            Knowledge shouldn't leave with people.
        </div>

        <div class="nav-title">Workspace</div>

        <a href="/dashboard.html" class="nav-item">Dashboard</a>
        <a href="/projects.html" class="nav-item active">Projects</a>
        <a href="/handovers.html" class="nav-item">Handovers</a>
        <a href="/tasks.html" class="nav-item">Tasks</a>
        <a href="/issues.html" class="nav-item">Issues</a>
        <a href="/knowledge.html" class="nav-item">Knowledge</a>
        <a href="/risk.html" class="nav-item">Risk</a>

        <div class="nav-title">System</div>

        <a href="/activity.html" class="nav-item">Activity</a>
        <a href="/profile.html" class="nav-item">Profile</a>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="topbar">
            <div class="welcome">
                <h1>Projects</h1>
                <p>Manage projects connected to your handovers.</p>
            </div>

            <div class="profile">AU</div>
        </div>

        <div class="project-header">
            <h2>Your Projects</h2>
            <div class="project-count" id="projectCount">Loading...</div>
        </div>

        <div class="projects" id="projectsContainer">
            <div class="loading">Loading projects...</div>
        </div>
    </main>

</div>

<script>
    fetch("/api/projects")
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to load projects");
            }

            return response.json();
        })
        .then(projects => {
            const container = document.getElementById("projectsContainer");
            const count = document.getElementById("projectCount");

            count.textContent = projects.length + " project(s)";
            container.innerHTML = "";

            if (projects.length === 0) {
                container.innerHTML =
                    '<div class="loading">No projects found.</div>';
                return;
            }

            projects.forEach(project => {
                const card = document.createElement("div");
                card.className = "project-card";

                const icon = document.createElement("div");
                icon.className = "project-icon";
                icon.textContent = "◈";

                const name = document.createElement("div");
                name.className = "project-name";
                name.textContent = project.name || "Untitled Project";

                const description = document.createElement("div");
                description.className = "project-description";
                description.textContent =
                    project.description || "No description available.";

                const footer = document.createElement("div");
                footer.className = "project-footer";

                const status = document.createElement("span");
                status.className = "status";
                status.textContent = project.status || "UNKNOWN";

                const projectId = document.createElement("span");
                projectId.className = "project-id";
                projectId.textContent = "Project #" + project.id;

                footer.appendChild(status);
                footer.appendChild(projectId);

                card.appendChild(icon);
                card.appendChild(name);
                card.appendChild(description);
                card.appendChild(footer);

                container.appendChild(card);
            });
        })
        .catch(error => {
            console.error("Project API error:", error);

            document.getElementById("projectCount").textContent =
                "Unable to load";

            document.getElementById("projectsContainer").innerHTML =
                '<div class="loading">Unable to load projects. Please refresh the page.</div>';
        });
</script>

</body>
</html>
